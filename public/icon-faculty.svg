<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="facultyBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Card with Safe Margin -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#facultyBg)" filter="url(#glow)" />
  <rect x="36" y="36" width="440" height="440" rx="92" stroke="url(#goldAccent)" stroke-width="6" opacity="0.8" fill="none" />

  <!-- Inner Dark Concentric Circle -->
  <circle cx="256" cy="256" r="176" fill="#062e22" opacity="0.4" />
  <circle cx="256" cy="256" r="170" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6" fill="none" opacity="0.6" />

  <!-- Faculty Verification Shield & Badge -->
  <g filter="url(#glow)">
    <!-- Large Shield Outline -->
    <path d="M 256 120 L 372 168 C 372 268 256 340 256 340 C 256 340 140 268 140 168 Z" fill="#ffffff" />
    <path d="M 256 136 L 356 178 C 356 260 256 322 256 322 C 256 322 156 260 156 178 Z" fill="#ecfdf5" />

    <!-- Teacher / Faculty Icon Inside Shield -->
    <!-- User Head -->
    <circle cx="256" cy="204" r="32" fill="#059669" />
    <!-- User Shoulders -->
    <path d="M 196 280 C 196 248 224 242 256 242 C 288 242 316 248 316 280 Z" fill="#059669" />
    <!-- Verification Check Badge -->
    <circle cx="298" cy="252" r="22" fill="#eab308" stroke="#ffffff" stroke-width="3" />
    <path d="M 288 252 L 295 259 L 309 245" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Quill / Pen Symbol -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 170 350 L 190 370" />
    <path d="M 342 350 L 322 370" />
  </g>

  <!-- Staff / Faculty Label Banner -->
  <rect x="136" y="420" width="240" height="42" rx="21" fill="#34d399" filter="url(#glow)" />
  <text x="256" y="447" fill="#064e3b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="3">STAFF / FACULTY</text>
</svg>
