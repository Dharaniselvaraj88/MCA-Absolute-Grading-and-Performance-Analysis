<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="adminBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Card with Safe Margin -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#adminBg)" filter="url(#glow)" />
  <rect x="36" y="36" width="440" height="440" rx="92" stroke="url(#goldAccent)" stroke-width="6" opacity="0.85" fill="none" />

  <!-- Inner Dark Concentric Circle -->
  <circle cx="256" cy="256" r="176" fill="#2e1065" opacity="0.4" />
  <circle cx="256" cy="256" r="170" stroke="#c084fc" stroke-width="3" stroke-dasharray="8 6" fill="none" opacity="0.6" />

  <!-- Admin Vault / Security Master Lock -->
  <g filter="url(#glow)">
    <!-- Lock Shackle -->
    <path d="M 196 210 L 196 170 C 196 136 222 110 256 110 C 290 110 316 136 316 170 L 316 210" stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none" />
    <!-- Lock Body -->
    <rect x="170" y="200" width="172" height="150" rx="26" fill="#ffffff" />
    <rect x="180" y="210" width="152" height="130" rx="18" fill="#f3e8ff" />

    <!-- Center Keyhole -->
    <circle cx="256" cy="260" r="18" fill="#581c87" />
    <path d="M 251 268 L 246 304 L 266 304 L 261 268 Z" fill="#581c87" />

    <!-- Gear Teeth around center symbol -->
    <circle cx="256" cy="275" r="54" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 8" fill="none" opacity="0.7" />
  </g>

  <!-- Admin Label Banner -->
  <rect x="146" y="420" width="220" height="42" rx="21" fill="#facc15" filter="url(#glow)" />
  <text x="256" y="447" fill="#4c1d95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="4">ADMIN</text>
</svg>
