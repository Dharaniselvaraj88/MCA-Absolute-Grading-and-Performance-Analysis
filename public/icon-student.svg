<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studentBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Card with Safe Margin -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#studentBg)" filter="url(#glow)" />
  <rect x="36" y="36" width="440" height="440" rx="92" stroke="url(#goldAccent)" stroke-width="6" opacity="0.8" fill="none" />

  <!-- Inner Concentric Circle -->
  <circle cx="256" cy="256" r="176" fill="#0f172a" opacity="0.35" />
  <circle cx="256" cy="256" r="170" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8 6" fill="none" opacity="0.6" />

  <!-- Graduation Cap & Student Assessment Symbol -->
  <g filter="url(#glow)">
    <!-- Mortarboard top -->
    <path d="M 256 140 L 390 196 L 256 252 L 122 196 Z" fill="#ffffff" />
    <!-- Cap under-shadow -->
    <path d="M 180 220 L 180 286 C 180 324 332 324 332 286 L 332 220 L 256 252 Z" fill="#e2e8f0" />
    <!-- Tassel -->
    <path d="M 364 206 L 374 276 L 386 280 L 378 304 L 370 280 L 374 276" fill="url(#goldAccent)" stroke="#ca8a04" stroke-width="2" />
    <circle cx="374" cy="206" r="6" fill="url(#goldAccent)" />
    <!-- Center Button -->
    <circle cx="256" cy="196" r="9" fill="url(#goldAccent)" />
  </g>

  <!-- Open Book Base -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M 256 348 C 220 332 170 332 144 340 L 144 404 C 170 396 220 396 256 412 C 292 396 342 396 368 404 L 368 340 C 342 332 292 332 256 348 Z" fill="#f8fafc" />
    <line x1="256" y1="348" x2="256" y2="412" stroke="#cbd5e1" stroke-width="3" />
  </g>

  <!-- Student Label Banner -->
  <rect x="146" y="420" width="220" height="42" rx="21" fill="#fbbf24" filter="url(#glow)" />
  <text x="256" y="447" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">STUDENT</text>
</svg>
